<!doctype html>
<html><head><meta charset="utf-8">
<!-- Adds the game title to a raw Blender cover render. Used by the cover screenshots:
     cover.html?img=../builds/covers/cover_landscape_raw.png&w=1920&h=1080&pos=top -->
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #c { position: relative; overflow: hidden; }
  #c img { display: block; width: 100%; height: 100%; }
  #t { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Pirata One', Georgia, serif; color: #f2c14e; line-height: .9;
       -webkit-text-stroke: .03em #3a2207; paint-order: stroke fill;
       text-shadow: 0 .04em 0 #7a4a0e, 0 .08em 0 #3a2207, 0 .12em .25em #000c, 0 0 .5em #000a; letter-spacing: .01em; }
  #t span { color: #e9dcc0; font-size: .62em; vertical-align: .14em; margin: 0 .08em; }
  .glow { position: absolute; left: 0; right: 0; pointer-events: none; }
</style></head>
<body><div id="c"><img id="img" alt=""><div class="glow" id="g"></div><div id="t">Bones <span>&amp;</span> Brine</div></div>
<script>
  const q = new URLSearchParams(location.search), w = +q.get('w'), h = +q.get('h'), pos = q.get('pos') || 'top';
  const c = document.getElementById('c'), t = document.getElementById('t'), g = document.getElementById('g');
  c.style.width = w + 'px'; c.style.height = h + 'px';
  document.getElementById('img').src = q.get('img');
  const size = Math.round(Math.min(w * 0.13, h * 0.17));
  t.style.fontSize = size + 'px';
  const pad = Math.round(h * 0.035);
  if (pos === 'bottom') { t.style.bottom = pad + 'px'; g.style.bottom = 0; g.style.height = (size * 2.1) + 'px'; g.style.background = 'linear-gradient(transparent, #000b)'; }
  else { t.style.top = pad + 'px'; g.style.top = 0; g.style.height = (size * 2.1) + 'px'; g.style.background = 'linear-gradient(#000b, transparent)'; }
  document.fonts.ready.then(() => { document.title = 'ready'; });
</script></body></html>
